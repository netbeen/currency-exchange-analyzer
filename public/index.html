<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇率分析可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="width: 80px"></div> <!-- Spacer for centering title -->
            <h1>USD/CNY 汇率分析</h1>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌓 切换主题</button>
        </div>
        
        <div class="controls">
            <button class="time-btn" onclick="updateTimeRange(60, this)">60天</button>
            <button class="time-btn" onclick="updateTimeRange(180, this)">180天</button>
            <button class="time-btn" onclick="updateTimeRange(365, this)">1年</button>
            <button class="time-btn" onclick="updateTimeRange(730, this)">2年</button>
            <button class="time-btn" onclick="updateTimeRange(1825, this)">5年</button>
            <button class="time-btn" onclick="updateTimeRange(3650, this)">10年</button>
            <button class="time-btn active" onclick="updateTimeRange(0, this)">全部</button>
        </div>

        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="macdChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
